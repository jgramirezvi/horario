<style>
    .main-menu {
        background-color: {{ menu_colors.bg_color }};
        overflow: hidden;
    }
    .main-menu ul {
        list-style-type: none;
        margin: 0;
        padding: 0;
        display: flex;
    }
    .main-menu li a, .main-menu .dropbtn {
        display: inline-block;
        color: {{ menu_colors.text_color }};
        text-align: center;
        padding: 14px 16px;
        text-decoration: none;
    }
    .main-menu li a:hover, .main-menu .dropdown:hover .dropbtn {

        background-color: {{ menu_colors.hover_bg_color }};

    }
    .main-menu .dropdown {
        position: relative;
        display: inline-block;
    }
    .main-menu .dropdown-content {
        display: none;
        position: absolute;

        min-width: 160px;

    }
    .main-menu .dropdown-content a {
        color: black;
        padding: 12px 16px;
        text-decoration: none;
        display: block;
        text-align: left;
    }
    .main-menu .dropdown-content a:hover {
        background-color: #f1f1f1;
    }
    .main-menu .dropdown:hover .dropdown-content {
        display: block;
    }

        <li><a href="{% url 'home' %}">Inicio</a></li>

            <div class="dropdown-content">
