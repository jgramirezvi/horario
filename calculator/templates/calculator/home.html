{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Inicio</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; background-color: #f4f4f9; }
        .header {
            width: 100%;
            background-color: #f8f9fa;
            padding: 10px 20px;
            text-align: center;
            border-bottom: 1px solid #dee2e6;
            box-sizing: border-box;
        }
        .header-title {
            color: darkblue;
            margin: 0;
            transition: color 0.3s;
            font-size: 2em; /* Tamaño de fuente más grande para el título */
        }
        .header-title:hover {
            color: steelblue;
        }
        .container { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        h1 { color: #333; }
        .btn {
            background-color: #007bff;
            color: white;
            padding: 15px 25px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 1.2em;
            transition: transform 0.2s ease-in-out;
        }
        .btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 class="header-title">Horarios</h1>
    </div>
    {% include 'calculator/menu.html' %}
    <div class="container">
        <h1>Bienvenido al Proyecto</h1>
        <a href="{% url 'portal' %}" class="btn">Ir al Portal</a>
    </div>
</body>
</html>
