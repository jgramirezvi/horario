{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        body { font-family: sans-serif; margin: 2em; }
        table { border-collapse: collapse; width: 300px; margin-top: 1em;}
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background-color: #f4f4f4; }
    </style>
</head>
<body>
    <style>
    .main-menu {
        background-color: blue;
        overflow: hidden;
    }
    .main-menu ul {
        list-style-type: none;
        margin: 0;
        padding: 0;
        display: flex;
    }
    .main-menu li a {
        display: inline-block;
        color: yellow;
        text-align: center;
        padding: 14px 16px;
        text-decoration: none;
    }
    .main-menu li a:hover {
        color: white;
        background-color: magenta;
        font-weight: bolder;
    }
</style>
<nav class="main-menu">
    <ul>
        <li><a href="{% url 'home' %}">Inicio</a></li>
        <li><a href="{% url 'portal' %}">Portal</a></li>
        <li><a href="{% url 'calculator' %}">Calculadora</a></li>
        <li><a href="{% url 'log_table' %}">Tabla de Logaritmos</a></li>
    </ul>
</nav>
    <h1>{{ title }}</h1>
    <p>Este es el resultado de tu script <code>prueba.py</code>, ahora en una página web.</p>
    <table>
        <thead>
            <tr>
                <th>Número (i)</th>
                <th>log(i)</th>
            </tr>
        </thead>
        <tbody>
            {% for item in data %}
            <tr>
                <td>{{ item.number }}</td>
                <td>{{ item.log|floatformat:4 }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
