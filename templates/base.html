{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Horarios{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'styles/base.css' %}">
    <style>
        :root {
            --menu-bg-color: {{ menu_colors.bg_color|default:'#f8f9fa' }};
            --menu-text-color: {{ menu_colors.text_color|default:'#343a40' }};
            --menu-hover-bg-color: {{ menu_colors.hover_bg_color|default:'#e9ecef' }};
            --menu-hover-text-color: {{ menu_colors.hover_text_color|default:'#0056b3' }};
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 class="header-title">Horarios</h1>
    </div>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
