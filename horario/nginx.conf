# Bloque para redirigir todo el tráfico HTTP a HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name tu_dominio.com www.tu_dominio.com;
    
    # Para la renovación de certificados de Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Escuchar en el puerto 443 para SSL
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tu_dominio.com www.tu_dominio.com;

    # Rutas a tus certificados SSL (ejemplo para Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/tu_dominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tu_dominio.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /favicon.ico { access_log off; log_not_found off; }

    location /static/ {
        # Ruta absoluta a tu directorio STATIC_ROOT
        root /home/jgramirezv/Documentos/Proyectos/horario;
    }

    location /media/ {
        # Ruta absoluta a tu directorio MEDIA_ROOT
        root /home/jgramirezv/Documentos/Proyectos/horario;
    }

    location / {
        include proxy_params;
        proxy_pass http://unix:/run/gunicorn.sock;
    }
}
